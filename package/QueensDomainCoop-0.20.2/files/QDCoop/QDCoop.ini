; Queen's Domain co-op mod settings. Lines starting with ; are comments. Delete a line to get its default back.
; This file lives next to QDCoop.dll in <game dir>\QueensDomain\Binaries\Win64\QDCoop\.

[Coop]
; Your name as teammates see it. Left at Player, your Steam name is used when the game runs with Steam.
PlayerName=Player
; UDP port for direct (LAN / port-forwarded) play. Steam friends play does not need it.
Port=27777
MaxPlayers=4
; Your knight, as your teammates see you: 0 Royal Knight, 1 Black Knight, 2 Silver Knight, 3 Wandering Knight.
; The Co-op screen and the co-op menu in the game change it (and write it here).
Knight=0
; Which of your three co-op saves hosting plays (1, 2 or 3). The Co-op screen's save list changes it.
Save=1
; 1: when a player uses one of the game's teleports - the Shop button of a checkpoint, the pad on the shop islet,
; a wing crystal - the whole party goes along. The host's setting counts.
TravelTogether=1
; How your teammates' fighting is shown to you: real = each knight holds the weapon its player really uses, and stands
; and swings in the style that goes with it; legacy = every knight with its own weapon and swings, as before 0.14.0.
; Your own setting (the picture only: what a hit does is decided as always).
TeammateWeapons=real

[Menu]
; 1: the title screen's Co-op entry opens the Co-op screen. 0: the plain list menu instead.
Screen=1
; On a controller the co-op menu opens and closes when View / Select is held this long, in seconds (0.3 to 1.5).
; A short press stays the game's own (its Status screen). On the keyboard: F8.
PadHoldSeconds=0.6

[Steam]
; 1: while you host, your Steam friends can join: "Join Game" in their friends list, invites from the co-op menu,
; your Steam code. Only Steam friends are let in that way. 0: direct/LAN only.
Enabled=1

[Join]
; 1: while you host, your game answers to its six-letter join code on your local network (UDP port 27779).
LanCodes=1
; A code changes after this many minutes (0: only when you host again). The co-op menu also makes a new one on request.
CodeMinutes=360

[Audio]
; How loud your teammates' steps and armour are, in percent of the game's own knight (whose sounds their bodies make).
; Your own setting; the co-op menu's settings page changes it. Attack sounds are not affected.
TeammateMovementVolume=35

[Dialogue]
; A talk with one of the game's people waits until every teammate is this near to them (in the game's units: 100 = 1 m).
; (Whether the party talks together at all is the host's rule, on the co-op menu's difficulty page.)
Radius=1500
; NPCs who are each player's own business - no waiting, no shared conversation (parts of their class names, comma separated).
IndividualNPCs=Merchant

; (Party rest: since 0.17.0 there is nothing to set. When anyone rests at a checkpoint the whole party is brought
; there and rests too - every game's enemies come back; when anyone saves there, everyone is brought and saved.
; The old [PartyRest] RegroupOnRest / RegroupOnSave lines are read no more.)

[Ping]
; Teammate pings: mark a place, an enemy or an item for the party. 1 on, 0 off.
Enabled=1
; The key: MiddleMouse, a letter or a digit (for example G), or None.
Key=MiddleMouse
; On a controller: R3 (the right stick's click) pings, and does nothing else. None: no ping from the controller.
PadButton=R3
; How long a ping stays, in seconds.
Seconds=8

[PartyHUD]
; The party's health bars on the left, in the game's own style. Your own settings: every player chooses theirs.
Enabled=1
; CenterLeft: the whole party as one group at the left edge, centred on the middle of the screen's height.
; TopLeft: under the game's own health and power bars, as before 0.16.0.
Position=CenterLeft
; You are in the group too (CenterLeft: with a bar of your own; TopLeft: your name under the game's own bar).
ShowLocalPlayer=1
Names=1
; Health as numbers next to the bars.
HealthNumbers=0
; DOWNED / RECONNECTING / LOADING labels.
DownedIndicators=1
; Small, Normal or Large.
Size=Normal
; 0.15 to 1.0
Opacity=1.0

[Combat]
; 1: a blow an enemy lands on the player it is after does not also hurt a teammate standing in the same spot (players
; walk through each other in co-op). A blow that reaches farther hurts everyone it reaches. The host's setting counts.
SingleTargetSwings=1

[Saves]
; Co-op never plays in the five slots the title screen shows. Your first co-op save lives in HostSlot; your second
; and third take the next free slots (10 and 11). When you JOIN others, your character of each campaign has a save
; slot of its own (20 and up: QDCoop\Saves\characters.json says which). ClientSlot is where the one shared character
; of versions before 0.16.0 lived: it is never loaded or changed any more, only copied into a campaign you had
; played with it.
HostSlot=8
ClientSlot=9

[Revive]
; Hold Interact this long next to a downed teammate.
Seconds=3.0
; Share of maximum health a revived player comes back with.
HealthFraction=0.35
; How close the reviver must be, in game units (100 = 1 m).
Radius=250
; After a team wipe the death screen continues by itself after this many seconds.
WipeAutoContinueSeconds=4

[Loot]
; Ordinary consumables (herbs, elixirs, cures, brews, crystal fragments) are each player's own: whoever picks one up
; has it, and the pickup stays for the others to take theirs. Everything else is found once for everyone.
; These "use" items are tools kept for good, not supplies, and are found once for everyone like a weapon:
SharedConsumables=UltimateWingCrystal,UltimateTeleporterCrystal,MementoMirror,PigeonFossil_Item,Grimoire_Item

[Healing]
; Healing items also heal teammates within this distance (game units, 550 = 5.5 m) ...
Radius=550
; ... by this share of what the user got. Healing never revives a downed teammate.
Share=0.6
; Items that count as healing (part of the item name).
Items=HealingHerb,HealingPotion,Panacea

[Difficulty]
; The party-size presets (Duo, Trio, Quartet): damage to enemies is divided by 1 + this x (players - 1). 0.45 means
; 1.45x effective health with two players, 1.9x with three, 2.35x with four. The host picks presets or custom values
; in the co-op menu (Difficulty); those are kept with the campaign.
EnemyHealthPerExtraPlayer=0.45
BossHealthPerExtraPlayer=0.65

[HUD]
Enabled=1
Names=1
Health=1
Distance=1
OffscreenMarkers=1
Notices=1
StatusLine=1
; A thin outline of a teammate's shape in their color, only when they are far away: none up to 20 m, fading in up
; to 35 m, then at a low steady strength. A downed teammate's is red.
Outline=1
Scale=1.0
; Player colors as RRGGBB: P1 cyan, P2 green, P3 orange, P4 purple.
ColorP1=00E5FF
ColorP2=40FF4D
ColorP3=FF8C1A
ColorP4=B861FF

[Puppet]
; How teammates look in your game (assets the game already has). With the game's knight as the body (the default),
; each teammate is the knight they chose: helmet, cloth and weapon come with it. Another body mesh is shown as it is.
BodyMesh=/Game/Enemies/JosamiKnight_00/Josami24/JosamiKnight.JosamiKnight
BodyAnimClass=/Game/Enemies/JosamiKnight_00/Josami24/JosamiKnight_Mace_ABP.JosamiKnight_Mace_ABP_C
BodyScale=0.85
BodyZOffset=-88
BodyYawOffset=-90
